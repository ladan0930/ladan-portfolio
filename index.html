<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ladan Abdi | Mechanical Engineering Intern Portfolio</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root {
      --bg: #020617;
      --bg-alt: #050816;
      --card: #020617;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.15);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
      --radius-lg: 16px;
      --radius-xl: 22px;
      --shadow-soft: 0 18px 40px rgba(15, 23, 42, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
        "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #020617 0, #000 70%);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 20px 64px;
      min-height: 100vh;
    }

    header.nav {
      position: sticky;
      top: 0;
      z-index: 100;
      margin-bottom: 32px;
      padding: 12px 20px;
      border-radius: 999px;
      background: linear-gradient(
          120deg,
          rgba(15, 23, 42, 0.96),
          rgba(15, 23, 42, 0.94)
        ),
        radial-gradient(circle at top left, rgba(56, 189, 248, 0.12), transparent);
      border: 1px solid rgba(148, 163, 184, 0.35);
      backdrop-filter: blur(18px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-soft);
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-logo {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid rgba(148, 163, 184, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      background: radial-gradient(circle at top, #1f2937, #020617);
    }

    .nav-title {
      display: flex;
      flex-direction: column;
      line-height: 1.2;
    }

    .nav-title span:first-child {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-title span:last-child {
      font-size: 12px;
      color: var(--muted);
    }

    .hero {
      margin-top: 40px;
      margin-bottom: 48px;
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 2fr);
      gap: 32px;
      align-items: center;
    }

    @media (max-width: 800px) {
      .hero {
        grid-template-columns: 1fr;
      }
    }

    .hero-text {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .hero-tag {
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid rgba(148, 163, 184, 0.45);
      width: fit-content;
    }

    .hero-tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #4ade80;
      box-shadow: 0 0 0 4px rgba(74, 222, 128, 0.15);
    }

    .hero-title {
      font-size: clamp(32px, 5vw, 44px);
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .hero-title span {
      color: var(--accent);
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: 16px;
      color: var(--muted);
      max-width: 520px;
    }

    .hero-card {
      border-radius: 20px;
      background: radial-gradient(circle at top, #020617, #000 70%);
      border: 1px solid rgba(148, 163, 184, 0.35);
      padding: 20px;
      font-size: 14px;
      box-shadow: var(--shadow-soft);
    }

    .hero-card ul {
      margin-left: 20px;
      margin-top: 10px;
      color: var(--muted);
    }

    .section {
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      border-left: 4px solid var(--accent);
      line-height: 1;
      padding-left: 12px;
    }

    .card {
      border-radius: var(--radius-xl);
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1),
        0 2px 4px -1px rgba(0, 0, 0, 0.06);
      backdrop-filter: blur(10px);
      margin-bottom: 24px;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
    }

    .card-tag {
      font-size: 13px;
      color: var(--accent);
      font-family: monospace;
      margin-bottom: 8px;
    }

    .card-section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #94a3b8;
      font-weight: 700;
      margin-top: 16px;
      margin-bottom: 6px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      padding-bottom: 4px;
      width: fit-content;
    }

    .card ul {
      margin-left: 20px;
      margin-bottom: 8px;
      color: #d1d5db;
      font-size: 14px;
    }

    .card li {
      margin-bottom: 6px;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 24px;
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .pill {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      color: var(--accent);
      font-weight: 500;
    }

    .project-images {
      margin: 16px 0;
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    }

    .project-images img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      object-fit: cover;
      aspect-ratio: 3/2;
      transition: transform 0.2s ease, border-color 0.2s ease;
      background: #000;
    }

    /* Extra-tall images for Enclosure & Robot */
    .project-images.tall img {
      aspect-ratio: 1/1;
    }

    .project-images img:hover {
      transform: scale(1.02);
      border-color: var(--accent);
    }

    .footer {
      margin-top: 40px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>

<body>
  <div class="page">
    <section id="projects" class="section">
      <article class="card">
        <h3 class="card-title">100 AMP SOCKET &amp; BREAKER</h3>
        <p class="card-tag">SolidWorks · Sheet Metal · Utility Hardware</p>

        <div class="project-images tall">
          <img src="HYDEL1.jpg" alt="Enclosure assembled" />
          <img src="HYDEL2.PNG" alt="Internal layout configurations" />
        </div>
      </article>

      <article class="card">
        <h3 class="card-title">Robotic Camera Inspection System</h3>
        <p class="card-tag">Camera · Fusion 360 · 3D-Printed Prototype</p>

        <div class="project-images tall">
          <img src="robot-assy RENDER.jpg" alt="Robotic Camera Render" />
          <img src="robot-camera-assembly.png" alt="Robotic Camera Close-up" />
          <img src="robot-camera-assembly2.png" alt="Technical Drawing" />
        </div>
      </article>
    </section>
  </div>
</body>
</html>
